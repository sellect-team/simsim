<!doctype html><meta charset="utf-8"><title>자동 캐릭터 시험</title>
<body style="background:#181820;color:#eee;font-family:system-ui;padding:14px">
<div id="log"></div>
<div id="out" style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px"></div>
<script type="module">
import { drawAutoCharacter, readCharacter, autoParts } from "/p/js/char/autochar.js";
import { FaceSprite } from "/p/js/char/face.js";

const 이름들 = ["누렁이 강아지", "냥이", "곰돌이", "토끼 순이", "여우", "꿀꿀이 돼지",
                "삐약이 병아리", "생쥐 찍찍", "호랑이 대장", "소년 민수",
                "이름만있는애", "또다른애", "세번째애"];
const W = 130, H = 130;
const out = document.getElementById("out");
let 총 = 0;
for (const n of 이름들) {
  const cfg = readCharacter(n);
  const t0 = performance.now();
  const img = drawAutoCharacter(n, 420);
  총 += performance.now() - t0;
  const sp = new FaceSprite(img, autoParts(n), 20, { view: "front", move: "breathe" });
  // 표정을 얹어 본다 — 올린 그림과 같은 길을 타는지 확인
  const 표정들 = ["blink", "happy", "surprised", "cry"];
  const row = document.createElement("div");
  row.style.cssText = "background:#221f2b;border-radius:8px;padding:5px";
  const line = document.createElement("div");
  line.style.cssText = "display:flex";
  표정들.forEach((e, i) => {
    const c = document.createElement("canvas");
    c.width = W; c.height = H;
    const g = c.getContext("2d");
    sp.expr = e;
    sp.draw(g, { x: 4, y: 4, w: W - 8, h: H - 8 }, 0.6 + i * 0.4);
    line.appendChild(c);
  });
  row.appendChild(line);
  const lab = document.createElement("div");
  lab.style.cssText = "font-size:12px;margin-top:3px";
  lab.textContent = `${n} → ${cfg.종류}${cfg.알아봄 ? "" : " (이름으로 고름)"}`;
  row.appendChild(lab);
  out.appendChild(row);
}
document.getElementById("log").textContent =
  `${이름들.length}명 · 그리는 데 합계 ${총.toFixed(0)}ms · 표정 blink/happy/surprised/cry 순`;
document.title = "그림 완료";
</script>
