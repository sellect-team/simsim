<!doctype html><meta charset="utf-8"><title>스토리 기능 점검</title>
<body style="background:#14131a;color:#e8e2d8;font-family:system-ui;padding:18px">
<pre id="out" style="white-space:pre-wrap;line-height:1.6;font-size:13px"></pre>
<script type="module">
const out = document.getElementById("out");
const lines = [];
let pass = 0, fail = 0;
const P = (name, ok, note = "") => {
  ok ? pass++ : fail++;
  lines.push(`${ok ? "✅" : "❌"} ${name}${note ? "  — " + note : ""}`);
  out.textContent = lines.join("\n");
  남기기();
};
/* 결과를 그때그때 남겨 둔다 — 맨 끝의 뒤로가기 검사가 이 페이지를 떠나 버려도
   무엇이 통과했는지 읽을 수 있어야 한다. */
function 남기기() {
  try { sessionStorage.setItem("점검결과", JSON.stringify({ pass, fail, lines })); }
  catch {}
}
const T = async (name, fn) => {
  try { const n = await fn(); P(name, true, n || ""); }
  catch (e) { P(name, false, String(e && e.message || e)); }
};
const eq = (a, b, what) => { if (a !== b) throw new Error(`${what}: ${a} ≠ ${b}`); };

// 뒤로가기 길잡이는 한 번 깨워 둬야 popstate 를 듣는다 (본 화면에서는 index.html 이 한다)
(await import("/p/js/ui/nav.js")).navInit();

const { parseScript, writeScript, musicBrief, SPOTS } = await import("/p/js/story/script.js");
const __stage = await import("/p/js/story/stage.js");
window.__stage = __stage;
const { Stage, TRANSITION_NAMES } = __stage;
const { EFFECTS, drawEffect } = await import("/p/js/story/fx.js");
const { StoryDoc } = await import("/p/js/story/doc.js");
const { AssetLibrary, library } = await import("/p/js/story/assets.js");
const { BakeQueue } = await import("/p/js/story/queue.js");
const { FaceSprite, BODY_MOVES, EXPRESSIONS, TEARS } = await import("/p/js/char/face.js");

lines.push("── 대본 문법 ──"); out.textContent = lines.join("\n");

await T("빈 대본도 안 죽는다", () => {
  const d = parseScript("");
  eq(d.scenes.length, 0, "장면 수"); eq(d.errors.length, 0, "오류 수");
});
await T("모르는 말은 오류로 알려 준다", () => {
  const d = parseScript("장면 배경\n  이건뭐지 이상한말");
  if (!d.errors.length) throw new Error("오류를 못 잡음");
  return `${d.errors[0].line}줄에서 잡음`;
});
await T("장면 없이 지시하면 알려 준다", () => {
  const d = parseScript('자막 "안녕"');
  if (!d.errors.length) throw new Error("오류를 못 잡음");
});
await T("시간은 자막·대기만 민다", () => {
  const d = parseScript(`장면 A\n  개 등장 왼쪽\n  개 이동 오른쪽 3초\n  자막 "가"\n  대기 2초\n  자막 "나"`);
  const s = d.scenes[0];
  const 자막 = s.steps.filter(x => x.kind === "자막");
  eq(자막[0].t, 0, "첫 자막 시각");
  const 이동 = s.steps.find(x => x.kind === "이동");
  eq(이동.t, 0, "이동 시각");             // 이동은 시간을 밀지 않는다
  if (자막[1].t <= 자막[0].t + 2) throw new Error("대기 2초가 반영 안 됨");
  return `둘째 자막 ${자막[1].t.toFixed(1)}초`;
});
await T("대본 → 구조 → 대본 왕복", () => {
  const src = `제목: 시험\n\n장면 배경 전환:페이드\n  개 등장 왼쪽 크기:0.5\n  자막 "가나다"\n`;
  const a = parseScript(src), b = parseScript(writeScript(a));
  eq(b.scenes.length, a.scenes.length, "장면 수");
  eq(b.scenes[0].steps.length, a.scenes[0].steps.length, "지시 수");

  const d = parseScript(`장면 A\n  카메라 줌인 2초 세기:1.4\n  카메라 흔들기 0.4초\n  자막 "가"`);
  const cam = d.scenes[0].steps.filter(x => x.kind === "카메라");
  eq(cam.length, 2, "카메라 지시 수");

});
await T("음악 프롬프트를 만든다", () => {
  const d = parseScript(`제목: ㄱ\n음악프롬프트: warm ukulele\n음악분위기: 포근한\n\n장면 A\n  자막 "가"`);
  const m = musicBrief(d);
  if (!m.suno.includes("warm ukulele") || !m.suno.includes("instrumental"))

  return m.suno;

lines.push("\n── 무대 ──"); out.textContent = lines.join("\n");

const cv = document.createElement("canvas");
cv.width = 180; cv.height = 320;
const cx = cv.getContext("2d");
const BOX = { x: 0, y: 0, w: 180, h: 320 };

await T("자산이 하나도 없어도 그려진다 (자리표시)", () => {
  const s = Stage.fromText(`장면 없는배경\n  없는애 등장 왼쪽\n  자막 "가"`, {});

});
await T("모든 효과가 오류 없이 그려진다", () => {
  Object.keys(EFFECTS).forEach(n => { for (const t of [0, 0.7, 1.9]) drawEffect(cx, BOX, n, t, {}); });
  return `${Object.keys(EFFECTS).length}종`;
});
await T("모든 전환이 오류 없이 그려진다", () => {
  for (const tr of TRANSITION_NAMES) {
    const s = Stage.fromText(`장면 A\n  자막 "가"\n\n장면 B 전환:${tr}\n  자막 "나"`, {});
    for (let t = 0; t < s.seconds; t += 0.25) s.drawAt(cx, BOX, t);
  }
  return `${TRANSITION_NAMES.length}종`;
});
/* 장면이 바뀔 때 어떤 장면을 몇 초 시점으로 그렸는지 엿본다 */
function 전환엿보기(s, t) {
  const calls = [];
  const real = s.drawScene.bind(s);
  s.drawScene = (c, b, sc, tt) => {
    if (s.scenes.includes(sc)) calls.push({ i: s.scenes.indexOf(sc), t: +tt.toFixed(3) });
    return real(c, b, sc, tt);
  };
  s.drawAt(cx, BOX, t);
  s.drawScene = real;
  return calls;
}

await T("전환을 안 적어도 부드럽게 넘어간다 (기본 페이드)", () => {
  const s = Stage.fromText(`장면 A\n  자막 "가"\n\n장면 B\n  자막 "나"`, {});
  const 겹침 = 전환엿보기(s, s.scenes[1].start + 0.15);
  if (!겹침.some(c => c.i === 0)) throw new Error("앞 장면을 안 겹쳐 그림 — 딱 잘려 끊긴다");
  if (!겹침.some(c => c.i === 1)) throw new Error("새 장면을 안 그림");
  const 첫장면 = 전환엿보기(s, 0.1);
  if (첫장면.length !== 1) throw new Error("첫 장면인데 전환을 함");
  return `겹쳐 그림 ${겹침.length}장 · 첫 장면은 1장`;
});

await T("전환 중에도 앞 장면이 얼어붙지 않는다", () => {
  const s = Stage.fromText(`장면 A\n  개 등장 가운데 동작:breathe\n  자막 "가"\n\n장면 B 전환:밀기\n  자막 "나"`, {});
  const c = 전환엿보기(s, s.scenes[1].start + 0.2);
  const 앞 = c.find(x => x.i === 0);
  if (!앞) throw new Error("앞 장면을 안 그림");
  if (앞.t <= s.scenes[0].seconds)
    throw new Error(`앞 장면이 ${앞.t}초에 멈춰 있음 (정지 사진)`);
  return `앞 장면 ${앞.t}초 (끝난 뒤에도 계속 움직임)`;
});

await T("전환길이를 대본에서 바꿀 수 있다", () => {
  const 짧 = Stage.fromText(`장면 A\n  자막 "가"\n\n장면 B 전환:페이드 전환길이:0.2초\n  자막 "나"`, {});
  const 김 = Stage.fromText(`장면 A\n  자막 "가"\n\n장면 B 전환:페이드 전환길이:1.2초\n  자막 "나"`, {});
  const t = 짧.scenes[1].start + 0.5;
  if (전환엿보기(짧, t).some(x => x.i === 0)) throw new Error("0.2초로 줄였는데 0.5초에도 겹침");
  if (!전환엿보기(김, t).some(x => x.i === 0)) throw new Error("1.2초로 늘렸는데 0.5초에 안 겹침");
  return "0.2초 · 1.2초 둘 다 맞음";
});

await T("영상 크기가 비율대로 나온다 (미리보기도 같은 값을 쓴다)", async () => {

                      return `${v.가로}×${v.세로}`; };
  eq(보기("9:16"), "720×1280", "세로 영상");
  eq(보기("16:9"), "1280×720", "가로 영상");
  eq(보기("1:1"), "1280×1280", "정사각");
  const v = videoSize(null, { 비율: "9:16", 세로: 1281 });
  if (v.세로 % 2 || v.가로 % 2) throw new Error("h264 는 짝수여야 하는데 " + v.가로 + "×" + v.세로);
  return "9:16 · 16:9 · 1:1 · 홀수 보정";
});

  eq(readScenery("노을 지는 들판").시간.이름, "노을", "노을");
  eq(readScenery("듣도보도못한곳").알아봄, false, "모르는 이름은 알려 준다");

await T("코드로 그리는 것은 '막는 부족'이 아니다", () => {

/* ── 게임에서 빌려 온 연출 ── */
await T("흔들기가 트라우마 제곱으로 줄어든다 (세게 시작해 스르르 잦아듦)", () => {
  const s = Stage.fromText(`장면 A\n  카메라 흔들기 1초 세기:1\n  자막 "가"`, {});
  const cam = t => { let v = 0; s.drawScene(cx, BOX, s.scenes[0], t); return v; };
  // 값을 직접 확인하려고 무대 안 함수를 쓴다
  const 세기 = t => {
    let 트 = 0;
    for (const q of s.scenes[0].cam.shakes)
      if (t >= q.t0 && t <= q.t1) 트 = Math.max(트, q.amp * (1 - (t - q.t0) / (q.t1 - q.t0)));
    return 트 * 트;
  };
  const a = 세기(0.05), b = 세기(0.5), c = 세기(0.95);
  if (!(a > b && b > c)) throw new Error(`잦아들지 않음 ${a}>${b}>${c}`);
  // 제곱이므로 절반 시점에는 1/4 근처여야 한다 (선형이면 1/2)
  if (b > 0.35) throw new Error(`절반 시점이 ${b.toFixed(2)} — 제곱이 아님(선형이면 0.5)`);
  for (let t = 0; t < 1.2; t += 0.05) s.drawAt(cx, BOX, t);   // 그리다 죽지 않는가
  return `0.05초 ${a.toFixed(2)} → 0.5초 ${b.toFixed(2)} → 0.95초 ${c.toFixed(2)}`;
});

await T("눌리기·늘어나기가 부피를 지킨다 (가로↔세로가 반대로)", () => {
  const s = Stage.fromText(`장면 A\n  개 등장 가운데\n  개 눌리기 0.4초 세기:1\n  자막 "가"`, {});
  const a = s.scenes[0].actors[0];
  if (!a.squash?.length) throw new Error("눌림 트랙이 없음");
  // 한가운데가 가장 납작해야 한다
  const 값 = t => { let v = 0;
    for (const q of a.squash) if (t >= q.t0 && t <= q.t1)
      v += q.amt * Math.sin((t - q.t0) / (q.t1 - q.t0) * Math.PI);
    return v; };
  const 가운데 = 값(0.2);
  if (!(가운데 < -0.1)) throw new Error(`납작해지지 않음 (${가운데.toFixed(2)})`);
  const sy = 1 + 가운데, sx = 1 / Math.max(0.4, sy);
  if (!(sx > 1 && sy < 1)) throw new Error(`부피가 안 지켜짐 가로${sx.toFixed(2)} 세로${sy.toFixed(2)}`);
  if (Math.abs(sx * sy - 1) > 0.01) throw new Error("가로×세로가 1이 아님");
  return `세로 ${sy.toFixed(2)} × 가로 ${sx.toFixed(2)} = ${(sx * sy).toFixed(3)}`;
});

await T("점프에 눌림·늘림이 저절로 붙는다", () => {
  const s = Stage.fromText(`장면 A\n  개 등장 가운데\n  개 점프 오른쪽 0.8초\n  자막 "가"`, {});
  const q = s.scenes[0].actors[0].squash || [];
  if (q.length < 3) throw new Error(`${q.length}개뿐 (웅크림·늘어남·착지 3개여야 함)`);
  if (!(q[0].amt < 0 && q[1].amt > 0 && q[2].amt < 0))
    throw new Error("웅크림(−) → 늘어남(+) → 착지(−) 차례가 아님");
  return `웅크림 ${q[0].amt} → 늘어남 ${q[1].amt} → 착지 ${q[2].amt}`;
});

await T("상태 한 낱말이 표정·동작·효과를 한꺼번에 건다", async () => {
  const { STATES } = await import("/p/js/char/moods.js");
  const s = Stage.fromText(`장면 A\n  개 등장 가운데\n  개 상태 놀람\n  자막 "가"`, {});
  const sc = s.scenes[0], a = sc.actors[0];
  const 표정 = a.events.find(e => e.kind === "표정");
  eq(표정?.value, STATES.놀람.표정, "표정");
  if (!a.events.some(e => e.kind === "동작")) throw new Error("동작이 안 걸림");
  if (!sc.effects.some(e => e.name === STATES.놀람.효과)) throw new Error("효과가 안 걸림");
  if (!sc.sounds.some(e => e.name === STATES.놀람.소리)) throw new Error("소리가 안 걸림");
  if (!a.squash.length) throw new Error("눌림이 안 걸림");
  if (!a.shakes.length) throw new Error("떨기가 안 걸림");
  if (!sc.cam.punches.length) throw new Error("카메라 펀치가 안 걸림");
  for (let t = 0; t < s.seconds; t += 0.1) s.drawAt(cx, BOX, t);
  return `한 줄이 ${["표정", "동작", "효과", "소리", "눌림", "떨기", "카메라"].length}가지를 검`;
});

await T("모든 상태가 오류 없이 그려진다", async () => {
  const { STATES } = await import("/p/js/char/moods.js");

const { findFace, applyFace } = await import("/p/js/char/facefind.js");
const { DEFAULT_PARTS } = await import("/p/js/char/face.js");
const loadImg = u => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = u; });

/* 얼굴을 '찾았다' 고 한 것만 모은다.
   자산 중에는 얼굴이 아예 없는 그림도 있다 (생각 풍선·소품 컷).
   그런 것에 억지로 눈을 찍지 않는 것이 옳은 동작이라, 못 찾은 것은 따로 센다. */
async function 정면들() {
  const out = { 찾음: [], 못찾음: [] };
  for (const c of library.characters.filter(x => (x.poses || {}).front)) {
    const img = await loadImg(`/api/char/sprite?id=${c.id}&role=front`);
    const f = findFace(img, "front");
    (f.확신 >= 0.35 && f.eyeL && f.eyeR ? out.찾음 : out.못찾음).push({ c, img, f });
  }
  return out;
}
const 정면 = await 정면들();

await T("정면 그림에서 눈 두 개를 찾는다", async () => {
  if (!정면.찾음.length && !정면.못찾음.length) return "정면 그림 있는 캐릭터 없음 — 건너뜀";
  for (const { c, f } of 정면.찾음) {
    // 두 눈은 나란하고, 입은 그 아래에 있어야 한다
    if (Math.abs(f.eyeL.y - f.eyeR.y) > 0.06) throw new Error(`${c.name} 두 눈 높이가 안 맞음`);
    if (f.mouth.y <= Math.max(f.eyeL.y, f.eyeR.y)) throw new Error(`${c.name} 입이 눈 위에 있음`);
  }
  return `찾음 ${정면.찾음.map(x => `${x.c.name} ${(x.f.확신 * 100).toFixed(0)}%`).join(" · ")}` +
         (정면.못찾음.length ? `　/　못 찾음 ${정면.못찾음.map(x => x.c.name).join(" · ")}` : "");
});

await T("얼굴이 없는 그림에는 억지로 눈을 찍지 않는다", async () => {
  // 못 찾은 것은 확신이 0 에 가까워야 한다 — '어중간한 확신' 이 가장 나쁘다
  const 어중간 = 정면.못찾음.filter(x => x.f.확신 > 0.15);
  if (어중간.length) {
    throw new Error("근거가 약한데 확신을 줌: " +
      어중간.map(x => `${x.c.name} ${(x.f.확신 * 100).toFixed(0)}%`).join(", "));
  }
  return 정면.못찾음.length
    ? 정면.못찾음.map(x => `${x.c.name} → ${x.f.사유 || "확신 0"}`).join(" · ")
    : "못 찾은 그림 없음";
});

await T("찾은 눈 자리가 실제로 어두운 곳인가 (그림과 대조)", async () => {
  if (!정면.찾음.length) return "찾은 얼굴 없음 — 건너뜀";
  const { c, img, f } = 정면.찾음[0];
  const n = 96;
  const t = document.createElement("canvas"); t.width = n; t.height = n;
  const g = t.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0, n, n);
  const d = g.getImageData(0, 0, n, n).data;
  const 밝기 = (fx, fy) => {                   // 0~1 좌표 → 픽셀 (가로·세로를 따로 반올림해야 한다)
    const i = (Math.round(fy * n) * n + Math.round(fx * n)) * 4;
    return (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114);
  };
  const 눈밝기 = (밝기(f.eyeL.x, f.eyeL.y) + 밝기(f.eyeR.x, f.eyeR.y)) / 2;
  // 얼굴 한가운데(눈 사이)는 밝아야 하고, 눈 자리는 어두워야 한다
  const 사이 = 밝기((f.eyeL.x + f.eyeR.x) / 2, (f.eyeL.y + f.eyeR.y) / 2);
  if (!(눈밝기 < 사이 - 40)) throw new Error(`눈 자리가 안 어두움 (눈 ${눈밝기.toFixed(0)} vs 사이 ${사이.toFixed(0)})`);
  return `눈 ${눈밝기.toFixed(0)} · 얼굴 ${사이.toFixed(0)} (차이 ${(사이 - 눈밝기).toFixed(0)})`;
});

await T("못 찾으면 손대지 않고 알린다 (엉뚱한 자리에 안 찍음)", async () => {
  const blank = document.createElement("canvas");
  blank.width = 64; blank.height = 64;
  const g = blank.getContext("2d");
  g.fillStyle = "#f0e0c0"; g.fillRect(8, 8, 48, 48);       // 얼굴 없는 네모
  const img = await loadImg(blank.toDataURL());
  const parts = DEFAULT_PARTS("front");
  const before = parts.eyeL.x;
  const r = applyFace(parts, img, "front");
  if (r.적용됨) throw new Error("얼굴이 없는데 찾았다고 함");
  eq(parts.eyeL.x, before, "손대지 않음");
  return `확신 ${(r.확신 * 100).toFixed(0)}%`;
});

await T("자산 창고가 얼굴을 맞춘 캐릭터를 내준다", async () => {
  if (!library.characters.length) return "건너뜀";
  library.clear();
  await library.refresh(true);
  const sp = await library.character(library.characters[0].name);
  if (!sp) return "캐릭터를 못 불러옴";
  const img = await loadImg(`/api/char/sprite?id=${library.characters[0].id}&role=front`);
  const f = findFace(img);
  const 차이 = Math.hypot(sp.parts.eyeL.x - f.eyeL.x, sp.parts.eyeL.y - f.eyeL.y);
  // 저장된 설정이 있으면 그걸 쓰므로 다를 수 있다 — 아주 멀면 문제
  if (차이 > 0.25) throw new Error(`눈 자리가 찾은 곳과 너무 다름 (${차이.toFixed(2)})`);
  return `찾은 곳과 ${(차이 * 100).toFixed(0)}% 차이`;
});

  return r.사유 || "안 찍음";
});
/** 눈이 하나뿐인 옆얼굴을 그려 준다 (자산에 기대지 않고 늘 같은 조건으로 재려고).
 *  자산의 'side' 슬롯에는 3/4 각도(두 눈이 다 보이는 그림)가 들어 있을 수 있어
 *  그것으로는 '눈 하나' 상황을 시험할 수 없다. */
function 옆얼굴그리기() {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#f2d9b0";                       // 머리 (살색 덩어리)
  g.beginPath(); g.ellipse(60, 58, 42, 40, 0, 0, 7); g.fill();
  g.fillStyle = "#f2d9b0";                       // 주둥이 (오른쪽으로 튀어나옴)
  g.beginPath(); g.ellipse(96, 68, 18, 13, 0, 0, 7); g.fill();
  g.fillStyle = "#241c14";                       // 눈 하나
  g.beginPath(); g.arc(74, 50, 6, 0, 7); g.fill();

  const g = c.getContext("2d", { willReadFrequently: true });
  const box = { x: 0, y: 0, w: 300, h: 300 };
  const 센다 = 적은것 => {
    g.clearRect(0, 0, 300, 300);
    SUB.drawSubtitle(g, box, "가", 1, { 세로: "가운데", ...적은것 });
    const d = g.getImageData(0, 0, 300, 300).data;
    let n = 0;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 8) n++;
    return n;
  };
  const 없음 = 센다({ 바탕: "없음" });
  const 박스 = 센다({ 바탕: "박스" });
  if (!(박스 > 없음 * 1.5)) throw new Error(`박스가 더 안 칠해짐 (없음 ${없음} · 박스 ${박스})`);
  return `없음 ${없음}칸 · 박스 ${박스}칸`;
});

await T("포즈 이름을 시점으로 써도 그리기가 안 죽는다", async () => {
  /* 실제로 겪었다. `포즈 angry` 가 부위 움직임 함수에 시점(front/side/back) 자리로 흘러들어
     AXIS["angry"].x 에서 터졌다. 굽기가 그 편에서 통째로 멈췄다. */
  const { PART_EFFECTS } = await import("/p/js/char/face.js");
  const R = await import("/p/js/char/rig.js");
  let 죽은것 = [];
  for (const [이름, e] of Object.entries(PART_EFFECTS)) {
    for (const v of ["front", "side", "back", "angry", "sleep", undefined, null, ""]) {
      try { e.fn(0.5, 1, v, 1); } catch (err) { 죽은것.push(`face.${이름}(${v})`); }
    }
  }
  for (const [이름, e] of Object.entries(R.PART_EFFECTS || {})) {
    for (const v of ["front", "angry", undefined]) {
      try { e.fn(0.5, 1, v, 1); } catch (err) { 죽은것.push(`rig.${이름}(${v})`); }
    }
  }
  if (죽은것.length) throw new Error(죽은것.slice(0, 4).join(", "));
  return `부위 움직임 ${Object.keys(PART_EFFECTS).length}종 × 낯선 시점에도 안 죽음`;
});

/* ── 🎨 보기 점검 ──
   눈으로는 잘 못 잡는 것들이다. 실제로 이런 일이 있었다.
     · 한 줄에 단추(47px)·작은 단추(35px)·입력칸(46px)이 섞여 줄이 울퉁불퉁했다
     · 체크박스가 브라우저 기본 13px 이라 누르기 힘들었다
     · 고른 하위 탭의 개수 글씨가 보라 바탕 위 은회색이라 2.4:1 로 거의 안 보였다
   화면을 통째로 띄워 재는 것은 무거우므로, **규칙이 지켜지는지**를 CSS 로 확인한다. */
/* 이 점검은 **본 화면의 CSS 를 그대로** 써야 뜻이 있다.
   여기는 딴 쪽(_check.html)이라 index.html 의 <style> 을 통째로 실어 온다. */
{
  const html = await (await fetch("/p/index.html")).text();
  const 스타일 = [...html.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/g)].map(m => m[1]).join("\n");
  const el = document.createElement("style");
  el.textContent = 스타일;
  document.head.appendChild(el);
}

await T("글씨가 바탕과 충분히 다르다", async () => {
  /* 반투명 바탕은 뒤엣것과 섞어야 진짜 색이 나온다 —
     안 그러면 rgba(255,255,255,0.05) 를 흰색으로 보고 죄다 '나쁨' 이 된다. */
  const 뜯기 = c => { const m = (String(c).match(/[\d.]+/g) || [0, 0, 0]).map(Number);
    return { r: m[0] || 0, g: m[1] || 0, b: m[2] || 0, a: m.length > 3 ? m[3] : 1 }; };
  const 밝기 = ({ r, g, b }) => { const f = x => { x = x / 255;
    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); };
  const 방 = document.createElement("div");
  방.style.cssText = "position:fixed; left:-9999px; top:0; width:700px; background:#0d0c12";
  방.innerHTML = `<h3 class="mkHead">소제목</h3>
    <div class="hint">흐린 안내글</div>
    <div class="subtabs"><button class="subtab on">고른 탭 <span class="hint">12</span></button></div>
    <div class="vitem"><span class="vinfo">작은 곁글</span></div>
    <span class="qm">?</span>`;
  document.body.appendChild(방);
  try {
    const 나쁜것 = [];
    방.querySelectorAll("*").forEach(el => {
      if (![...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) return;
      const cs = getComputedStyle(el);
      const 쌓기 = []; let p = el;
      while (p && p !== document.documentElement) {
        const c = 뜯기(getComputedStyle(p).backgroundColor);
        if (c.a > 0) 쌓기.push(c);
        if (c.a >= 1) break;
        p = p.parentElement;
      }
      let bg = { r: 13, g: 12, b: 18 };
      for (let i = 쌓기.length - 1; i >= 0; i--) { const c = 쌓기[i];
        bg = { r: c.r * c.a + bg.r * (1 - c.a), g: c.g * c.a + bg.g * (1 - c.a),
               b: c.b * c.a + bg.b * (1 - c.a) }; }
      const a = 밝기(뜯기(cs.color)), b = 밝기(bg);
      const 비 = (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
      const 큼 = parseFloat(cs.fontSize) >= 18.66 ||
                 (parseFloat(cs.fontSize) >= 14 && +cs.fontWeight >= 700);
      if (비 < (큼 ? 3 : 4.5))
        나쁜것.push(`${el.className || el.tagName} ${비.toFixed(1)}:1`);
    });
    if (나쁜것.length) throw new Error(나쁜것.join(", "));
    return "소제목·안내글·고른 탭·곁글·물음표 모두 4.5:1 넘음";
  } finally { 방.remove(); }
});

    열쇠들.forEach(k => { if (typeof o[k] !== "function") 빠진것.push(`${이름}.${k}`); });
  }
  if (빠진것.length) throw new Error("끊김: " + 빠진것.join(", "));
  return Object.keys(있어야할것).join(" · ");
});

await T("저장된 프로젝트에 겹친 이야기 아이디가 없다", async () => {
  const d = await (await fetch("/api/project/list")).json();

await T("저장된 프로젝트가 없는 영상을 가리키지 않는다", async () => {

    (await fetch("/api/videos")).json(),
  ]);

/* ── ⬅ 뒤로가기 ──
   길잡이(nav.js)가 브라우저 뒤로가기를 어떻게 받아 처리하는지 잰다.

   진짜 history.back() 은 쓰지 않는다. 뒤로가 한 번이라도 넘치면 **이 검사 페이지를 떠나**
   나머지가 통째로 안 돌아가기 때문이다 (실제로 그렇게 됐다).
   대신 브라우저가 보내는 것과 **똑같은 신호**를 만들어 쏜다 —
   nav.js 는 history.state 의 깊이만 보고 움직이므로 지나온 길이 완전히 같다.
   (진짜 뒤로가기는 앱에서 손으로 확인했다: 작업실→프로젝트→단계→팝업 5층을 쌓고
    네 번 눌러 정확히 거꾸로 돌아온다.) */
{
  const NAV = await import("/p/js/ui/nav.js");
  const 쉬다 = ms => new Promise(r => setTimeout(r, ms));
  /** 브라우저가 그 깊이로 물러난 척한다 */
  const 뒤로 = async 깊이 => {
    history.replaceState({ 공작소깊이: 깊이 }, "");
    dispatchEvent(new PopStateEvent("popstate", { state: { 공작소깊이: 깊이 } }));
    await 쉬다(40);
  };

  await T("뒤로가기가 걸음을 하나씩 되돌린다", async () => {
    const 한일 = [], 시작 = NAV.깊이();
    NAV.밀기("ㄱ", () => 한일.push("ㄱ"));
    NAV.밀기("ㄴ", () => 한일.push("ㄴ"));
    eq(NAV.깊이(), 시작 + 2, "쌓인 걸음");
    await 뒤로(시작 + 1);
    eq(한일.join(","), "ㄴ", "한 번 물러났을 때");
    await 뒤로(시작);
    eq(한일.join(","), "ㄴ,ㄱ", "두 번 물러났을 때");
    eq(NAV.깊이(), 시작, "다 되돌린 뒤 깊이");
    return "쌓은 차례의 거꾸로 되돌아감";
  });

  await T("뒤로를 여러 번 빨리 눌러도 한꺼번에 되돌아간다", async () => {
    const 한일 = [], 시작 = NAV.깊이();
    NAV.밀기("ㄱ", () => 한일.push("ㄱ"));
    NAV.밀기("ㄴ", () => 한일.push("ㄴ"));
    NAV.밀기("ㄷ", () => 한일.push("ㄷ"));
    await 뒤로(시작);                      // 세 걸음을 한 번에 건너뛴 셈
    eq(한일.join(","), "ㄷ,ㄴ,ㄱ", "되돌린 차례");
    eq(NAV.깊이(), 시작, "깊이");
    return "세 걸음이 한 번에 거꾸로 풀림";
  });

  await T("앞으로 가기는 건드리지 않는다", async () => {
    const 한일 = [], 시작 = NAV.깊이();
    NAV.밀기("ㄱ", () => 한일.push("ㄱ"));
    await 뒤로(시작 + 5);                  // 우리가 모르는 자리 (앞으로 가기 등)
    eq(한일.length, 0, "되돌린 횟수");
    eq(NAV.깊이(), 시작 + 1, "깊이 그대로");
    await 뒤로(시작);                      // 뒷정리
    return "모르는 자리에서는 가만히 있음";
  });

  await T("팝업이 뒤로가기로 닫힌다", async () => {
    const M = await import("/p/js/ui/modal.js");
    const 시작 = NAV.깊이();
    M.openModal({ 제목: "가", 내용: "가" });
    M.openModal({ 제목: "나", 내용: "나" });         // 겹쳐 열기 — 걸음은 하나여야 한다
    eq(NAV.깊이(), 시작 + 1, "겹쳐 열었을 때 깊이");
    await 뒤로(시작);
    if (document.querySelector(".uiModal")) throw new Error("뒤로가기로 안 닫힘");
    eq(NAV.깊이(), 시작, "닫은 뒤 깊이");
    return "겹쳐 열어도 뒤로 한 번이면 닫힘";
  });

  await T("스스로 닫으면 걸음도 함께 빠진다", async () => {
    const 시작 = NAV.깊이();
    let 불림 = 0;
    NAV.밀기("ㄷ", () => 불림++);
    if (!NAV.있나("ㄷ")) throw new Error("걸음이 안 쌓임");
    NAV.빼기("ㄷ");
    eq(NAV.깊이(), 시작, "깊이");
    eq(불림, 0, "되돌리기가 불린 횟수");     // 스스로 닫았으니 다시 닫으면 안 된다
    if (NAV.있나("ㄷ")) throw new Error("걸음이 안 빠짐");
    await 쉬다(150);                       // 뒤따라오는 popstate 를 흘려 보낸다
    return "히스토리와 걸음이 함께 물러남";
  });
}
