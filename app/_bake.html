<!doctype html><meta charset="utf-8"><title>고구마 굽기 만들기</title>
<body style="background:#181820;color:#eee;font-family:system-ui;padding:20px">
<div id="log" style="white-space:pre-wrap;line-height:1.7">준비 중…</div>
<script type="module">
import { StoryDoc } from "/p/js/story/doc.js";
import { library } from "/p/js/story/assets.js";
import { bakeVideo, waitJob } from "/p/js/story/render.js";
const el = document.getElementById("log");
const say = m => { el.textContent += "\n" + m; };
el.textContent = "시작";
try { const f = new FontFace("Gaegu", 'url("/p/fonts/Gaegu-Bold.ttf")'); await f.load(); document.fonts.add(f); } catch {}
await library.refresh(true);
const 개 = library.characters.find(c => c.name.includes("우리집"))?.name || library.characters[0].name;
const 배 = (library.backgrounds.find(b => b.name.includes("공원")) || library.backgrounds[0]).name;
say(`캐릭터: ${개} · 배경: ${배}`);

const 대본 = `제목: 고구마 굽기
비율: 9:16
음악프롬프트: warm acoustic ukulele, cozy campfire crackle, gentle 90bpm, playful children's storybook
음악분위기: 포근하고 느긋한

# ── 1. 불 피우기
장면 ${배}   전환:페이드
  ${개} 등장 가운데 크기:0.62 표정:blink 동작:breathe
  효과 장작 위치:0.5,0.86 크기:1.1
  카메라 줌인 3초 세기:1.15
  자막 "고구마를 구워 볼까요?"   등장:타이핑   소리:톡
  ${개} 표정 surprised 팝
  효과 입김 위치:0.66,0.74 크기:1.1
  자막 "후~ 불어 주세요"   소리:휙
  효과 불꽃 위치:0.5,0.84 크기:0.85
  ${개} 눈물 well
  자막 "앗, 연기가…"   효과:김

# ── 2. 구워지는 중
장면 ${배}   전환:흐림 전환길이:0.8초
  ${개} 등장 왼쪽 크기:0.58 동작:sway
  효과 장작 위치:0.62,0.9 크기:1
  효과 불꽃 위치:0.62,0.84 크기:0.95
  효과 고구마 위치:0.62,0.93 크기:0.8 익힘:0.2
  ${개} 대사 "조금만 기다려~"
  대기 0.8초
  카메라 흔들기 0.4초 세기:0.8
  효과 반짝임 위치:0.62,0.72
  자막 "다 구웠다!"   등장:튀어나옴   소리:딩   효과:번쩍

# ── 3. 먹기
장면 ${배}   전환:확대 전환길이:0.7초
  ${개} 등장 가운데 크기:0.7 동작:bounce 표정:happy
  효과 장작 위치:0.5,0.9 크기:0.9
  효과 고구마 위치:0.5,0.84 크기:0.9 익힘:1
  자막 "맛있게 먹어야지~~"   효과:하트
  ${개} 표정 surprised 팝
  ${개} 떨기 0.6초 세기:1.3
  효과 땀 위치:0.5,0.42
  자막 "앗 뜨거!"   소리:쿵   등장:튀어나옴
  ${개} 표정 happy 서서히 0.5초
  자막 "그래도 맛있어!"   효과:반짝임
`;

const doc = new StoryDoc(대본, "고구마 굽기");
await doc.build(library);
say(`${doc.sceneCount}장면 · ${doc.seconds.toFixed(1)}초 · 오류 ${doc.errors.length}`);
if (doc.errors.length) say(doc.errors.map(e => `${e.line}줄: ${e.msg}`).join("\n"));
say("효과음: " + doc.stage.soundsBetween(0, 99).map(s => `${s.name}@${s.at.toFixed(1)}`).join(", "));

const r = await bakeVideo(doc.stage, { 이름: "고구마 굽기", 세로: 1280, fps: 30 },
  p => { el.textContent = el.textContent.replace(/\n굽는 중.*$/, "") + `\n굽는 중 ${p.percent}% (${p.done}/${p.total}장)`; });
say(`\n프레임 ${r.프레임수}장 · ${r.가로}×${r.세로}`);
const done = await waitJob(r.job);
say(done.state === "done" ? `✅ ${done.filename} (${(done.size/1048576).toFixed(2)}MB)` : `❌ ${done.error}`);

// 작업실에도 이야기로 남긴다
const need = doc.missingWithPrompts(), 쓰는것 = doc.needs();
const t = document.createElement("canvas"); t.width = 180; t.height = 320;
doc.stage.drawAt(t.getContext("2d"), { x: 0, y: 0, w: 180, h: 320 }, 6);
await fetch("/api/project/save", { method: "POST", headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ name: "고구마 굽기", text: 대본, seconds: doc.seconds,
    scenes: doc.sceneCount, missing: need, uses: { 배우: 쓰는것.배우, 배경: 쓰는것.배경 },
    music_prompt: doc.music.suno, videos: [done.filename].filter(Boolean),
    thumb: t.toDataURL("image/jpeg", 0.7) }) });
say("작업실에도 저장했습니다.");
document.title = done.state === "done" ? "완성" : "실패";
</script>
